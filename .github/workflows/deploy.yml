name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  schedule:
    # Publish scheduled posts at noon Beijing time (UTC+8).
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - uses: actions/checkout@v4
        with:
          repository: zxkane/zxkane.github.io
          path: public/
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          
      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Singapore"

      - name: Read .env
        id: hugo-version
        run: |
          cat ./.env >> $GITHUB_ENV

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.0.0
        with:
          hugo-version: '${{ env.HUGO_VERSION }}'
          extended: true

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
  
      - name: Generate modern images
        run: |
          brew install imagemagick
          npm install -g avif
          ./scripts/image_optimize.sh
          
      - name: Build
        run: |
          # Clear stale build artifacts so source-side deletions propagate to gh-pages.
          # Keep .git so the deploy commit lands on the right branch.
          find public -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          hugo --minify

      - name: Deploy
        run: |
          cd public/
          git config --global user.name 'Kane Zhu'
          git config --global user.email '843303+zxkane@users.noreply.github.com'
          git add -A
          git commit -m "new release at `date`" || echo "nothing to commit"
          git push

  disable-after-scheduled-run:
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'skipped' && github.event_name == 'schedule' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disable this workflow after the scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable deploy.yml --repo "$GITHUB_REPOSITORY"
          workflow_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml" --jq '.state')
          test "$workflow_state" = disabled_manually
